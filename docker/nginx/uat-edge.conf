# UAT vhosts on the production nginx edge. Bound into conf.d at runtime so
# prod can pick up UAT routing without rebuilding the SPA image.
# uat-nginx is resolved at request time so prod still boots if UAT is down.

server {
    listen 80;
    server_name uat.ie-orbit.com app-uat.ie-orbit.com ops-uat.ie-orbit.com api-uat.ie-orbit.com;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name uat.ie-orbit.com app-uat.ie-orbit.com ops-uat.ie-orbit.com api-uat.ie-orbit.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $uat_upstream http://uat-nginx:80;

    location / {
        proxy_pass $uat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 15m;
    }
}
