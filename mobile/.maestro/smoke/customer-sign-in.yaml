# Customer app — sign in smoke (requires QA_CUSTOMER_EMAIL / QA_CUSTOMER_PASSWORD).
appId: ${APP_ID}

---
- launchApp:
    clearState: true
- assertVisible:
    text: "Sign in"
    optional: true
- assertVisible:
    text: "Welcome back"
- tapOn:
    text: "Email"
    optional: true
- inputText: ${QA_CUSTOMER_EMAIL}
- tapOn:
    text: "Password"
    optional: true
- inputText: ${QA_CUSTOMER_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "Book"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "Shop"
    timeout: 30000
    optional: true
