[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-orbit-backend"
version = "0.1.0"
description = "Django backend for IE Orbit"
requires-python = ">=3.13"
dependencies = [
  "black>=24.10,<25",
  "celery>=5.4,<6",
  "dj-database-url>=2.2,<3",
  "django>=5.2,<6",
  "django-redis>=5.4,<6",
  "django-cors-headers>=4.6,<5",
  "cryptography>=46,<47",
  "djangorestframework>=3.15,<4",
  "djangorestframework-simplejwt>=5.3,<6",
  "google-auth[requests]>=2.29,<3",
  "requests>=2.32,<3",
  "drf-spectacular>=0.28,<1",
  "boto3>=1.35,<2",
  "gunicorn>=23,<24",
  "pillow>=11,<12",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "pytesseract>=0.3.10,<1",
  "pyzbar>=0.1.9,<1",
  "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py313"]
