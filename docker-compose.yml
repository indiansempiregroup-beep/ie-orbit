name: ie-orbit

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
      args:
        APP_ENV: development
    working_dir: /app/backend
    command: >-
      sh -c "python manage.py migrate && python manage.py seed_white_label_profiles --create-pilot --all-businesses && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@host.docker.internal:5432/ie_orbit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      PYTHONPATH: /app/backend
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      PLATFORM_UPI_VPA: ${PLATFORM_UPI_VPA:-}
      PLATFORM_UPI_NAME: ${PLATFORM_UPI_NAME:-IE Orbit}
      PLATFORM_PAYMENT_QR_URL: ${PLATFORM_PAYMENT_QR_URL:-}
      PLATFORM_MEDIA_STORAGE_PROVIDER: ${PLATFORM_MEDIA_STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_SIGNED_URL_TTL_PUBLIC: ${R2_SIGNED_URL_TTL_PUBLIC:-86400}
      R2_SIGNED_URL_TTL_PRIVATE: ${R2_SIGNED_URL_TTL_PRIVATE:-900}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend-python-cache:/root/.cache/pip
      - backend-media:/app/backend/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      ie-orbit:
        aliases:
          - backend

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        APP_ENV: development
    working_dir: /app
    command: >-
      sh -c "pnpm install --frozen-lockfile --filter @ie-orbit/web... && mkdir -p /app/web/node_modules/@ie-orbit && ln -sfn ../../../packages/i18n /app/web/node_modules/@ie-orbit/i18n && ln -sfn ../../../packages/sdk /app/web/node_modules/@ie-orbit/sdk && pnpm --dir web dev --host 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_DEV_API_PROXY: http://backend:8000
      VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:3000}
      VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL:-http://127.0.0.1:3000}
      VITE_OPS_MOBILE_WEB_URL: ${VITE_OPS_MOBILE_WEB_URL:-http://localhost:8082}
      PNPM_HOME: /root/.local/share/pnpm
      PNPM_STORE_DIR: /root/.local/share/pnpm/store/v3
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@host.docker.internal:5432/ie_orbit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Keep Linux container modules out of the host bind mount. Without these,
      # restarting web can remove/replace the macOS modules Metro is actively using.
      - web-root-node-modules:/app/node_modules
      - web-app-node-modules:/app/web/node_modules
      - web-sdk-node-modules:/app/packages/sdk/node_modules
      - web-i18n-node-modules:/app/packages/i18n/node_modules
      - pnpm-store:/root/.local/share/pnpm/store/v3
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      ie-orbit:
        aliases:
          - web

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      ie-orbit:
        aliases:
          - redis

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
      args:
        APP_ENV: development
    working_dir: /app/backend
    command: celery -A config.celery worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,celery-worker}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@host.docker.internal:5432/ie_orbit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      PYTHONPATH: /app/backend
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      PLATFORM_UPI_VPA: ${PLATFORM_UPI_VPA:-}
      PLATFORM_UPI_NAME: ${PLATFORM_UPI_NAME:-IE Orbit}
      PLATFORM_PAYMENT_QR_URL: ${PLATFORM_PAYMENT_QR_URL:-}
    volumes:
      - .:/app
      - backend-python-cache:/root/.cache/pip
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "celery -A config.celery inspect ping >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      ie-orbit:
        aliases:
          - celery-worker

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
      args:
        APP_ENV: development
    working_dir: /app/backend
    command: celery -A config.celery beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,celery-beat}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@host.docker.internal:5432/ie_orbit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      PYTHONPATH: /app/backend
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      PLATFORM_UPI_VPA: ${PLATFORM_UPI_VPA:-}
      PLATFORM_UPI_NAME: ${PLATFORM_UPI_NAME:-IE Orbit}
      PLATFORM_PAYMENT_QR_URL: ${PLATFORM_PAYMENT_QR_URL:-}
    volumes:
      - .:/app
      - backend-python-cache:/root/.cache/pip
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[c]elery.*beat' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      ie-orbit:
        aliases:
          - celery-beat

  mailpit:
    image: axllent/mailpit:v1.20.3
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "--version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      ie-orbit:
        aliases:
          - mailpit

volumes:
  redis-data:
  backend-python-cache:
  backend-media:
  pnpm-store:
  web-root-node-modules:
  web-app-node-modules:
  web-sdk-node-modules:
  web-i18n-node-modules:

networks:
  ie-orbit:
    driver: bridge
